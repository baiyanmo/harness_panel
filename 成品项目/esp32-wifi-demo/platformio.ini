; PlatformIO Project Configuration File
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
framework = arduino
board = esp32dev
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_deps =
    knolleary/PubSubClient @ ^2.8
build_flags =
  -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
